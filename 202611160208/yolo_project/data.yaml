# YOLO 数据集配置（Level 3 步骤1）
# path 为数据集根目录，train/val 为其相对路径
# 注意：path 是本机绝对路径，换电脑/克隆仓库后请改成本机的 dataset 目录
path: d:/Projects/YOLO/yolo_project/dataset
train: images/train
val: images/val

# 类别编号必须与标注时 LabelImg 的 predefined_classes 顺序一致
# obstacle 定义：画面中心的蓝色泡沫盒子（椅子/门架等为背景，不标注）
names:
  0: obstacle
  1: cola
  2: football
