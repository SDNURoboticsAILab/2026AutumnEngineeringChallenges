# ============================================================================
#  Ultralytics YOLO 数据集配置文件  ——  data.yaml
#  位置: 你的学号/data.yaml
# ----------------------------------------------------------------------------
#  作用：告诉 YOLO「图片在哪、一共几类、每类叫什么」。
#  train.py / predict.py 通过 data="data.yaml" 引用本文件。
#
#  【路径规范】本文件只使用相对路径，不含 C:/ D:/ 之类绝对路径，
#             因此项目整体拷贝到 Windows / Linux / Colab 都能直接跑。
# ============================================================================


# ---------------------------------------------------------------------------
# 一、训练集 / 验证集【图片】目录
# ---------------------------------------------------------------------------
# 两个关键点：
#
# (1) 只写「图片目录」，不要写 labels 目录。
#     YOLO 的约定是：把图片路径里的 /images/ 自动替换成 /labels/，
#     再去里面找同名 .txt。写了 labels 反而多余且容易出错。
#
# (2) 这里【故意不写 path: 这个键】。
#     原因：Ultralytics 会把相对的 path 拼接它自己的全局 datasets_dir
#     （默认在 ultralytics 包安装目录旁边），而不是拼到本 yaml 所在目录，
#     于是 `path: dataset` 会让它去找 <datasets_dir>/dataset/images/train，
#     最终报 "Dataset ... images not found" 直接退出。
#     省略 path 后，Ultralytics 以【本 yaml 文件所在目录】为数据集根目录，
#     于是下面两行等价于：
#         <项目根>/dataset/images/train
#         <项目根>/dataset/images/val
#     这样无论项目被拷到哪里，路径都能正确解析。
# ---------------------------------------------------------------------------
train: dataset/images/train    # 训练集图片：img01.jpg ~ img04.jpg（4 张）
val: dataset/images/val        # 验证集图片：img05.jpg ~ img06.jpg（2 张）


# ---------------------------------------------------------------------------
# 二、类别数量 nc（number of classes）
# ---------------------------------------------------------------------------
# 本项目共 3 类：obstacle（障碍物）、cola（可乐）、football（足球）。
# nc 必须与下面 names 的条目数量严格相等，否则检测头维度不匹配会报错。
# ---------------------------------------------------------------------------
nc: 3


# ---------------------------------------------------------------------------
# 三、类别名称 names
# ---------------------------------------------------------------------------
# 字典的 key 就是标签 .txt 第一列写的那个数字（class_id）。
# 这三行必须与标注文件里的编号严格一致；写反了模型会把可乐认成足球，
# 而且训练过程【不会报任何错误】，只是按错误的定义学习，非常隐蔽。
#
# 本项目映射关系（固定，不要随意改动）：
#   0 -> obstacle  障碍物：蓝色方块障碍、跨栏立柱、纸盒等挡路物体
#   1 -> cola      可乐：瓶子（细长、深色瓶身 + 瓶盖）
#   2 -> football  足球：球类目标（白黑足球、橙色圆球，均为球形目标）
# ---------------------------------------------------------------------------
names:
  0: obstacle
  1: cola
  2: football


# ---------------------------------------------------------------------------
# 四、数据规模说明（Ultralytics 会忽略，仅供人阅读）
# ---------------------------------------------------------------------------
# 数据来源 : 实验室机器人场景实物拍摄（非公开数据集）
# 图片数量 : train 4 张 / val 2 张，共 6 张
# 图片分辨率: 640 x 480（宽 x 高）
# 标注格式 : <class_id> <x_center> <y_center> <width> <height>
#            后四项均为 0~1 归一化值（除以图片宽/高），不是像素坐标
# 目标框数 : train 12 个（obstacle 4 / cola 2 / football 6）
#            val 6 个（football 6）
# 划分方式 : 按场景分层，train 与 val 场景不重叠，保证 val 能检验泛化能力
# ---------------------------------------------------------------------------
